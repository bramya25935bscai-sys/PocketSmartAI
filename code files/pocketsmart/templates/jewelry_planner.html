{% extends "base.html" %}
{% block title %}Jewelry Planner · PocketSmart AI{% endblock %}
{% block content %}
<section class="planner">
  <h1>Jewelry Budget Planner</h1>
  <p class="hint">Upload an outfit photo (optional). Catalogs are sample Amazon/Flipkart data.</p>
  <form id="jewelry-form" class="grid-form" enctype="multipart/form-data">
    <label>Budget (INR) <input name="budget" type="number" value="15000" required /></label>
    <label>Occasion
      <select name="occasion">
        <option value="wedding guest" selected>Wedding guest</option>
        <option value="wedding">Wedding / bridal</option>
        <option value="party">Party</option>
        <option value="office">Office</option>
        <option value="casual">Casual</option>
      </select>
    </label>
    <label>Style
      <select name="style">
        <option value="traditional">Traditional</option>
        <option value="modern">Modern</option>
        <option value="classic" selected>Classic</option>
        <option value="ethnic">Ethnic</option>
        <option value="bridal">Bridal</option>
      </select>
    </label>
    <label>Outfit image (optional) <input name="outfit" type="file" accept="image/*" /></label>
    <button type="submit">Generate jewelry plan</button>
  </form>
  <div id="results" class="results"></div>
</section>
{% endblock %}

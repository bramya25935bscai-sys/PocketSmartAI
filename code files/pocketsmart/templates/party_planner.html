{% extends "base.html" %}
{% block title %}Party Planner · PocketSmart AI{% endblock %}
{% block content %}
<section class="planner">
  <h1>Party Budget Planner</h1>
  <p class="hint">Sample data from Swiggy, Zomato, Amazon, Flipkart and OYO.</p>
  <form id="party-form" class="grid-form">
    <label>Budget (INR) <input name="budget" type="number" value="50000" required /></label>
    <label>Guest count <input name="guests" type="number" value="40" required /></label>
    <label>Event type
      <select name="event_type">
        <option value="birthday" selected>Birthday</option>
        <option value="wedding">Wedding</option>
        <option value="corporate">Corporate</option>
        <option value="anniversary">Anniversary</option>
        <option value="casual">Casual</option>
      </select>
    </label>
    <label>Venue
      <select name="venue">
        <option value="home">Home</option>
        <option value="banquet">Banquet</option>
        <option value="hotel">Hotel / OYO stay</option>
      </select>
    </label>
    <button type="submit">Generate party plan</button>
  </form>
  <div id="results" class="results"></div>
</section>
{% endblock %}

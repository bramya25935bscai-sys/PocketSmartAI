{% extends "base.html" %}
{% block title %}Register · PocketSmart AI{% endblock %}
{% block content %}
<section class="form-card">
  <h1>Create account</h1>
  <form id="register-form">
    <label>Name <input name="name" required value="Riya Sharma" /></label>
    <label>Email <input name="email" type="email" required value="riya@example.com" /></label>
    <label>Password <input name="password" type="password" required value="demo1234" /></label>
    <button type="submit">Register</button>
  </form>
  <p id="auth-msg" class="msg"></p>
</section>
{% endblock %}
